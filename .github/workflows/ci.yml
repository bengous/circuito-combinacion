name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint and format
        run: npx biome ci --error-on-warnings .
      - name: Unused files, exports and dependencies
        run: npm run lint:unused
      - name: File size
        run: npm run check:size
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Build
        run: npm run build

  e2e:
    # Real browser on the production build: layout matrix, user journeys, axe.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds, then serves dist/)
        run: npm run test:e2e
      - name: Upload the HTML report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
