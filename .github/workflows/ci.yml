name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The $/ form zizmor asks for fails actionlint 1.7.12; this step runs right after the checkout.
      - uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: node
          github-token: ${{ secrets.MISE_GITHUB_TOKEN }}
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint and format
        run: npx biome ci --error-on-warnings .
      - name: Unused files, exports and dependencies
        run: npm run lint:unused
      - name: File size
        run: npm run check:size
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Build
        run: npm run build

  e2e:
    name: e2e
    # Real browser on the production build: layout matrix, user journeys, axe.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The $/ form zizmor asks for fails actionlint 1.7.12; this step runs right after the checkout.
      - uses: ./.github/actions/mise # zizmor: ignore[self-repository]
        with:
          tools: node
          github-token: ${{ secrets.MISE_GITHUB_TOKEN }}
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (builds, then serves dist/)
        run: npm run test:e2e
      - name: Upload the HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
