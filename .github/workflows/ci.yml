name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint and format
        run: npx biome ci --error-on-warnings .
      - name: File size
        run: npm run check:size
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
