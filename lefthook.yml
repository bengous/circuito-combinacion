# Git hooks, installed automatically by `npm install`.
pre-commit:
  commands:
    biome:
      glob: '*.{js,mjs,ts,tsx,json,css}'
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
commit-msg:
  commands:
    conventional:
      run: node scripts/check-commit-msg.mjs {1}
pre-push:
  commands:
    check:
      run: npm run check
